name: Build sanitized history branch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/privacy-sanitize.yml"

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create sanitized branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B sanitize-main "$GITHUB_SHA"
          git config user.name "tobiashoehler-lgtm"
          git config user.email "337494662+tobiashoehler-lgtm@users.noreply.github.com"
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch -f --env-filter '
            export GIT_AUTHOR_EMAIL="337494662+tobiashoehler-lgtm@users.noreply.github.com"
            export GIT_COMMITTER_EMAIL="337494662+tobiashoehler-lgtm@users.noreply.github.com"
          ' -- sanitize-main
          git rm -f .github/workflows/privacy-sanitize.yml
          git commit -m "Remove temporary privacy workflow"
          git push origin HEAD:refs/heads/sanitized-main
